name: Cross-Platform Parallel Builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output-path: build/linux/x64/release/bundle/
          - os: ubuntu-latest
            platform: android
            output-path: build/app/outputs/flutter-apk/
          - os: macos-latest
            platform: macos
            output-path: build/macos/Build/Products/Release/
          - os: windows-latest
            platform: windows
            output-path: build/windows/x64/runner/Release/

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Java/JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Get Short SHA
        id: git_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build Application
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            flutter build windows --release --dart-define=GIT_HASH=${{ steps.git_sha.outputs.sha }}
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            flutter build macos --release --dart-define=GIT_HASH=${{ steps.git_sha.outputs.sha }}
          elif [ "${{ matrix.platform }}" = "android" ]; then
            flutter build apk --release --dart-define=GIT_HASH=${{ steps.git_sha.outputs.sha }}
          else
            flutter build linux --release --dart-define=GIT_HASH=${{ steps.git_sha.outputs.sha }}
          fi
        shell: bash

      - name: Package Artifacts
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            powershell -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/branched-windows.zip'"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            cd build/macos/Build/Products/Release/
            zip -r ../../../../../dist/branched-macos.zip branched.app
          elif [ "${{ matrix.platform }}" = "android" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/branched-android.apk
          else
            cd build/linux/x64/release/bundle/
            tar -czf ../../../../../dist/branched-linux.tar.gz *
          fi
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: branched-${{ matrix.platform }}
          path: ${{ matrix.output-path }}

      - name: Upload Packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: branched-${{ matrix.platform }}-dist
          path: dist/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: branched-linux-dist
          path: dist

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: branched-macos-dist
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: branched-windows-dist
          path: dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: branched-android-dist
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/branched-linux.tar.gz
            dist/branched-macos.zip
            dist/branched-windows.zip
            dist/branched-android.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
